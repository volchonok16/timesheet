# Nginx внутри Docker — единая точка входа (хост :30080 → контейнер :80).
# Монтируется в контейнер nginx как /etc/nginx/conf.d/default.conf

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost mateplace.ru www.mateplace.ru;

    client_max_body_size 16m;

    location /api/ {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_pass http://backend:8000/api/;
    }

    location / {
        include /etc/nginx/snippets/proxy-common.conf;
        # Vite dev отклоняет внешний Host — для прокси передаём localhost
        proxy_set_header Host localhost;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://frontend:5173;
    }
}
