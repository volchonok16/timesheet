# TFS Timesheet — mateplace.ru, www, api.
#
# Установка на Ubuntu/Debian:
#   sudo mkdir -p /var/www/certbot
#   sudo cp -r deploy/nginx/snippets /etc/nginx/snippets/
#   sudo cp deploy/nginx/mateplace.conf /etc/nginx/sites-available/mateplace.conf
#   sudo ln -sf /etc/nginx/sites-available/mateplace.conf /etc/nginx/sites-enabled/mateplace.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Сертификат:
#   sudo certbot certonly --webroot -w /var/www/certbot \
#     -d mateplace.ru -d www.mateplace.ru -d api.mateplace.ru

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# --- HTTP → HTTPS + ACME ---
server {
    listen 80;
    listen [::]:80;
    server_name mateplace.ru www.mateplace.ru api.mateplace.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# www → apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mateplace.ru;

    include snippets/ssl-mateplace.conf;

    return 301 https://mateplace.ru$request_uri;
}

# --- Frontend: mateplace.ru ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mateplace.ru;

    include snippets/ssl-mateplace.conf;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        include snippets/proxy-common.conf;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_pass http://127.0.0.1:18080/api/;
    }

    location / {
        include snippets/proxy-common.conf;
        proxy_set_header Host localhost;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://127.0.0.1:15173;
    }
}

# --- API: api.mateplace.ru ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.mateplace.ru;

    include snippets/ssl-mateplace.conf;

    client_max_body_size 16m;

    location / {
        include snippets/proxy-common.conf;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_pass http://127.0.0.1:18080;
    }
}
