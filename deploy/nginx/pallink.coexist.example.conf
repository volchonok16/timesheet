# Пример nginx для pallink.fun на том же VPS, что и mateplace.ru
# Скопируйте: sudo cp deploy/nginx/pallink.coexist.example.conf /etc/nginx/sites-available/pallink.conf
# Порты 32080/32573 — не пересекаются с Timesheet (31080/31573)
# Уберите default_server с listen 443 в других конфигах.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name pallink.fun www.pallink.fun;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pallink.fun;

    ssl_certificate /etc/letsencrypt/live/pallink.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pallink.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://pallink.fun$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pallink.fun;

    ssl_certificate /etc/letsencrypt/live/pallink.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pallink.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://127.0.0.1:32080/api/;
    }

    location / {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Host localhost;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://127.0.0.1:32573;
    }
}
