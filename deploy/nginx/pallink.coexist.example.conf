# Пример nginx для pallink.fun на том же VPS, что и mateplace.ru
#
# ВАЖНО: порты в proxy_pass = порты из «docker ps» у контейнеров pallink!
#   - если Roadmap ещё на 8000/5173 — замените 32080→8000 и 32573→5173 ниже
#   - если в .env pallink заданы 32080/32573 — оставьте как есть
#
#   sudo cp deploy/nginx/pallink.coexist.example.conf /etc/nginx/sites-available/pallink.conf
#   sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name pallink.fun www.pallink.fun;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pallink.fun;

    ssl_certificate /etc/letsencrypt/live/pallink.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pallink.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://pallink.fun$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pallink.fun;

    ssl_certificate /etc/letsencrypt/live/pallink.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pallink.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://127.0.0.1:32080/api/;
    }

    location / {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Host localhost;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://127.0.0.1:32573;
    }
}
