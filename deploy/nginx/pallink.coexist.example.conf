# nginx для pallink.fun рядом с mateplace.ru (Timesheet на 31080/31573).
#
# Roadmap по умолчанию остаётся на 8000 (API) и 5173 (Vite) — не пересекается с Timesheet.
# Порты в proxy_pass должны совпадать с «docker ps» контейнеров pallink.
#
#   sudo cp deploy/nginx/pallink.coexist.example.conf /etc/nginx/sites-available/pallink.conf
#   sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name pallink.fun www.pallink.fun;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pallink.fun;

    ssl_certificate /etc/letsencrypt/live/pallink.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pallink.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://pallink.fun$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pallink.fun;

    ssl_certificate /etc/letsencrypt/live/pallink.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pallink.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://127.0.0.1:8000/api/;
    }

    location / {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Host localhost;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://127.0.0.1:5173;
    }
}
