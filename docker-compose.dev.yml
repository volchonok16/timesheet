# Локальная отладка: nginx на :18080, сервисы только внутри Docker-сети.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Откройте http://localhost:18080

services:
  postgres:
    ports:
      - "15433:5432"

  backend:
    environment:
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:18080}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:18080}

  frontend:
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "18080:80"
    volumes:
      - ./deploy/nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/snippets/proxy-common.conf:/etc/nginx/snippets/proxy-common.conf:ro
    depends_on:
      - frontend
      - backend
